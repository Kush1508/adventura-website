<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 220" width="100%" height="100%">
  <defs>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ================= EMBLEM (LEFT) ================= -->
  <g transform="translate(15, 10)">
    <!-- Surrounding 4-Way Bracket Loops -->
    <!-- Top Bracket -->
    <path d="M 75 42 C 75 22, 125 22, 125 42" stroke="#F0281F" stroke-width="9" stroke-linecap="round" fill="none" />
    <path d="M 68 28 C 68 14, 82 14, 82 28" stroke="#F0281F" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M 118 28 C 118 14, 132 14, 132 28" stroke="#F0281F" stroke-width="7" stroke-linecap="round" fill="none" />

    <!-- Bottom Bracket -->
    <path d="M 75 158 C 75 178, 125 178, 125 158" stroke="#F0281F" stroke-width="9" stroke-linecap="round" fill="none" />
    <path d="M 68 172 C 68 186, 82 186, 82 172" stroke="#F0281F" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M 118 172 C 118 186, 132 186, 132 172" stroke="#F0281F" stroke-width="7" stroke-linecap="round" fill="none" />

    <!-- Left Bracket -->
    <path d="M 42 75 C 22 75, 22 125, 42 125" stroke="#F0281F" stroke-width="9" stroke-linecap="round" fill="none" />
    <path d="M 28 68 C 14 68, 14 82, 28 82" stroke="#F0281F" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M 28 118 C 14 118, 14 132, 28 132" stroke="#F0281F" stroke-width="7" stroke-linecap="round" fill="none" />

    <!-- Right Bracket -->
    <path d="M 158 75 C 178 75, 178 125, 158 125" stroke="#F0281F" stroke-width="9" stroke-linecap="round" fill="none" />
    <path d="M 172 68 C 186 68, 186 82, 172 82" stroke="#F0281F" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M 172 118 C 186 118, 186 132, 172 132" stroke="#F0281F" stroke-width="7" stroke-linecap="round" fill="none" />

    <!-- Central Interlocking Puzzle Tile Core -->
    <path d="
      M 72 58 
      H 128 
      C 128 42, 148 42, 148 58 
      V 72 
      C 164 72, 164 92, 148 92 
      V 108 
      C 164 108, 164 128, 148 128 
      V 142 
      H 128 
      C 128 158, 108 158, 108 142 
      H 92 
      C 92 158, 72 158, 72 142 
      H 58 
      V 128 
      C 42 128, 42 108, 58 108 
      V 92 
      C 42 92, 42 72, 58 72 
      V 58 Z
    " stroke="#F0281F" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#logoGlow)" />
  </g>

  <!-- ================= BRAND TEXT (RIGHT) ================= -->
  <!-- ADVENTURA Stencil Text -->
  <text x="240" y="115" fill="#F0281F" font-family="'Cinzel', 'Inter', 'Segoe UI', sans-serif" font-size="78" font-weight="900" letter-spacing="9" filter="url(#logoGlow)">ADVENTURA</text>
  
  <!-- Official Tagline -->
  <text x="245" y="162" fill="#FFFFFF" font-family="'Inter', 'Segoe UI', sans-serif" font-size="24" font-weight="400" letter-spacing="1.5" opacity="0.95">Trust. Transparency. Transformation.</text>
</svg>
